<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stacked Layout</title>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      font-family: sans-serif;
      overflow: hidden;
      position: relative;
    }

    .stack-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    #bgVideo {
      position: absolute;
      bottom: 0;
      left: -10%;
      width: 120vw;
      height: 60vh;
      object-fit: cover;
      z-index: 2;
    }

    .bg-image {
      position: absolute;
      top: -30%;
      left: -10%;
      width: 120vw;
      height: 80vh; /* Only top 30% */
      object-fit: cover;
      z-index: 1;
    }

    .book-now-button {
      position: absolute;
      left: 50%;
      bottom: 20vh; /* Halfway into the 60vh video */
      transform: translateX(-50%);
      z-index: 2;
      padding: 1em 2em;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="stack-container">
    <!-- Background Video -->
    <video id="bgVideo" autoplay muted loop playsinline>
      <source src="./HomePage/HomePageItems/video.mp4" type="video/mp4" />
    </video>

    <!-- Background Image -->
    <img src="./HomePage/HomePageItems/Background.png" alt="Page Background" class="bg-image" />

    <!-- Book Now Button -->
    <a href="About.html" class="book-now-button"><img src="./HomePage/HomePageItems/BookNowButtonImage.png"
      style="background-color: transparent;"/>
    </a>

    <!-- Logo -->
    <img src="./HomePage/HomePageItems/Logo.png" alt="Logo" style="position: absolute; top: 0%; left: 43.25%; width: 200px; z-index: 3;" />

    <!-- Arrows -->
    <img src="./HomePage/HomePageItems/Arrow1.png" alt="Left Arrow" style="position: absolute; top: 50%; left: 10%; width: 500px; z-index: 3;" />
  </div>

</body>
</html>
