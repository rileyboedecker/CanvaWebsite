<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stacked Layout</title>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      font-family: sans-serif;
      overflow: hidden;
      position: relative;
    }

    .stack-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    #bgVideo {
      position: absolute;
      bottom: 0;
      left: -10%;
      width: 120vw;
      height: 56vh;
      object-fit: cover;
      z-index: 2;
    }

    .bg-image {
      position: absolute;
      top: -30%;
      left: -10%;
      width: 120vw;
      height: 80vh; /* Only top 30% */
      object-fit: cover;
      z-index: 1;
    }
  </style>
<!-- Include GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<!-- Include your global tween script -->
<script src="./tween.js"></script>

</head>
<body>

  <div class="stack-container">
    <!-- Background Video -->
    <video id="bgVideo" autoplay muted loop playsinline>
      <source src="./HomePage/HomePageItems/video.mp4" type="video/mp4" />
    </video>

    <!-- Background Image -->
    <img src="./HomePage/HomePageItems/Background.png" alt="Page Background" class="bg-image" />

    <!-- Navigation Buttons -->
    <a href="About.html" style="
            display: inline-block;
            position: absolute;
            top: 30%;
            left: 5%;
            z-index: 3;
      ">
        <img src="./HomePage/HomePageItems/AboutButtonImage.png" 
            alt="About Button" class="tween-item"
             />
      </a>

      <a href="About.html" style="
      display: inline-block;
      position: absolute;
      top: 30%;
      left: 31%;
      z-index: 3;
      ">
        <img src="./HomePage/HomePageItems/ContactButtonImage.png" 
            alt="About Button" class="tween-item"
            />
      </a>

      <a href="About.html" style="
      display: inline-block;
      position: absolute;
      top: 30%;
      right: 31%;
      z-index: 3;
      ">
        <img src="./HomePage/HomePageItems/PackagesServicesButtonImage.png" 
            alt="About Button" class="tween-item"
            />
      </a>

      <a href="About.html" style="
      display: inline-block;
      position: absolute;
      top: 30%;
      right: 5%;
      z-index: 3;
      ">
        <img src="./HomePage/HomePageItems/ReviewsButtonImage.png" 
            alt="About Button" class="tween-item"
            />
      </a>

    <!-- Logo -->
    <img src="./HomePage/HomePageItems/Logo.png" alt="Logo" class="tween-item" style="position: absolute; top: 0%; left: 43.25%; width: 200px; z-index: 3;" />

    <!-- Book Now Button -->
    <a href="About.html" style="
    display: inline-block;
    position: absolute;
    top: 63.25%;
    left: 39%;
    z-index: 3;
"><img src="./HomePage/HomePageItems/BookNowButtonImage.png" class="tween-item"/>
    </a>

    <!-- Arrows -->
    <img src="./HomePage/HomePageItems/Arrow1.png" alt="Left Arrow" class="tween-item arrow-fade"
    style="position: absolute; top: 60%; left: -5%; width: 600px; z-index: 3;" />
    <img src="./HomePage/HomePageItems/Arrow2.png" alt="Right Arrow" class="tween-item arrow-fade"
    style="position: absolute; top: 60%; right: -7%; width: 600px; z-index: 3;" />

  </div>

  <script>
    // Example usage on page load
    window.addEventListener("DOMContentLoaded", () => {
    tweenElements(".tween-item", {
      from: { opacity: 0, scale: 0.8 },
      to: {
        opacity: 1,
        scale: 1,
        duration: 1.2,
        ease: "back.out(1.7)"
      },
      stagger: 0.2
    });

    // Looping opacity fade for arrows
    gsap.to(".arrow-fade", {
  duration: 1.5,
  repeat: -1,
  yoyo: true,
  ease: "sine.inOut",
  css: {
    filter: "brightness(1)"
  },
  onUpdate: function () {
    // Manually toggle brightness using GSAP's set() to avoid overwriting the full filter stack
    const progress = this.progress();
    const brightness = 0.5 + 0.5 * Math.sin(progress * Math.PI); // ranges ~0.95–1
    gsap.set(".arrow-fade", {
      filter: `brightness(${brightness})`
    });
  }
});
    });
  </script>

</body>
</html>
